 d.innerHTML=`<div style="background:var(--bg);color:var(--ink);border-radius:16px;padding:20px;max-width:360px;width:100%"><p style="margin:0 0 16px">${html}</p><div style="display:flex;gap:8px"><button class="btn" id="aY" style="flex:1">${lab}</button>${noCancel?"":'<button class="btn o" id="aN" style="flex:1">Plus tard</button>'}</div></div>`;

function authMsg(m){m=String(m||"");if(/invalid login/i.test(m))return"E-mail ou mot de passe incorrect.";if(/already registered|already been registered/i.test(m))return"Cet e-mail a déjà un compte.";if(/password should|at least/i.test(m))return"Mot de passe trop court (6 caractères minimum).";if(/valid email|invalid.*email/i.test(m))return"Adresse e-mail invalide.";if(/rate limit/i.test(m))return"Trop d’essais. Réessayez dans quelques minutes.";return m}

/* ---------- Écrans d'entrée ---------- */
function welcome(){
 $("app").innerHTML=`<div class="view" style="display:flex;flex-direction:column;justify-content:space-between;text-align:center;padding:40px 28px 28px;background:linear-gradient(#EAF6FD,#fff)"><div style="margin-top:40px">${LOGO}<h1 style="margin:14px 0 6px;color:#1673B6">Bienvenue sur Mayschat</h1><p style="margin:0 0 8px;color:#1673B6;font-weight:600">La messagerie des savoir-faire</p><p style="margin:0;color:#667781">Discutez, collaborez et signez avec des professionnels qui partagent vos compétences.</p></div><div><p style="color:#667781;font-size:13px">Touchez « Accepter et continuer » pour accepter les <a href="#" id="lt" style="color:#1673B6">conditions d’utilisation</a> et la <a href="#" id="lp" style="color:#1673B6">politique de confidentialité</a>.</p><button class="btn" id="ac" style="width:100%;padding:14px">Accepter et continuer</button></div></div>`;
 $("lt").onclick=ev=>{ev.preventDefault();ask("<b>Conditions d’utilisation</b><br><br>Mayschat est en phase de test. Vos profils, messages et contrats sont enregistrés pour faire fonctionner l’application. Les contrats signés ici n’ont pas de valeur juridique garantie.<br><br><i>Texte provisoire, à remplacer par des conditions rédigées avec un juriste.</i>",()=>{},"Fermer",true)};
 $("lp").onclick=ev=>{ev.preventDefault();ask("<b>Politique de confidentialité</b><br><br>Nous enregistrons votre e-mail, votre nom, votre ville, vos compétences, votre photo, vos messages et vos contrats. Les messages et contrats ne sont visibles que par les personnes concernées. Les profils sont visibles par les membres.<br><br><i>Texte provisoire, à remplacer par une politique rédigée avec un juriste.</i>",()=>{},"Fermer",true)};
 $("ac").onclick=perms}
function perms(){
 const row=(id,ic,t,d)=>`<div class="item" style="cursor:default"><div style="font-size:28px">${ic}</div><div class="b"><b>${t}</b><p style="white-space:normal">${d}</p></div><button class="btn o" id="${id}" style="padding:8px 14px">Autoriser</button></div>`;
 $("app").innerHTML=`<div class="view" style="background:linear-gradient(#EAF6FD,#fff)"><div style="text-align:center;padding:36px 20px 8px">${LOGO}<h2 style="margin:8px 0 4px;color:#1673B6">Autorisations</h2><p style="margin:0;color:#667781">Mayschat a besoin de ces accès pour partager des photos et vous prévenir.</p></div>${row("pc","📷","Appareil photo","Prendre des photos pour votre profil et vos discussions.")}${row("pp","🖼️","Photos","Choisir des images de votre téléphone.")}${row("pn","🔔","Notifications","Être prévenu quand un professionnel de votre domaine s’inscrit.")}<div style="padding:20px"><button class="btn" id="pgo" style="width:100%;padding:14px">Continuer</button></div></div>`;

 $("pc").onclick=()=>{if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){toast(e(camErr()));return mark("pc",0,"Indisponible ici")}navigator.mediaDevices.getUserMedia({video:true,audio:true}).then(s=>{s.getTracks().forEach(t=>t.stop());mark("pc",1)}).catch(er=>{toast(e(camErr(er)));mark("pc",0,"Non autorisé")})};
 $("pp").onclick=()=>mark("pp",1);
 $("pn").onclick=()=>{if(!("Notification" in window))return mark("pn",0,"Indisponible ici");try{Notification.requestPermission().then(r=>mark("pn",r==="granted","Refusé")).catch(()=>mark("pn",0,"Indisponible ici"))}catch(x){mark("pn",0,"Indisponible ici")}};
 $("pgo").onclick=()=>{ls.set("mayschat_ok","1");authScreen("signup")}}
function authScreen(mode){const su=mode==="signup";
 $("app").innerHTML=`<div class="view"><div class="form" style="margin-top:24px;text-align:center">${LOGO}<h2 style="margin:0">${su?"Créer un compte":"Se connecter"}</h2>${su?'<input id="an" placeholder="Votre nom" autocomplete="name">':""}<input id="ae" type="email" placeholder="Adresse e-mail" autocomplete="email"><input id="ap" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="${su?"new-password":"current-password"}"><button class="btn" id="ago">${su?"Créer mon compte":"Se connecter"}</button><p id="aer" style="color:#C62828;margin:0"></p><button class="btn o" id="asw">${su?"J’ai déjà un compte":"Créer un compte"}</button></div></div>`;
 $("asw").onclick=()=>authScreen(su?"login":"signup");
 $("ago").onclick=async()=>{const em=$("ae").value.trim(),pw=$("ap").value,nm=su?$("an").value.trim():"",er=m=>{$("aer").textContent=m};

/* ---------- Démarrage et données ---------- */
async function loadAll(){
 const [p,m,c]=await Promise.all([sb.from("profiles").select("*"),sb.from("messages").select("*").order("created_at"),sb.from("contracts").select("*").order("created_at")]);
 if(p.error||m.error||c.error){toast("Chargement impossible : "+e((p.error||m.error||c.error).message));return false}

 .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},pl=>{const m=pl.new;if(!m||(m.sender!==U.id&&m.recipient!==U.id)||MSG.some(x=>x.id===m.id))return;MSG.push(m);onMsg(m)})

 $("kok").onclick=()=>{const t=$("kti").value.trim(),d=$("kd").value.trim(),sg=$("ksg").value.trim();if(!t||!d||sg.length<3){$("er").textContent="Indiquez un titre, l’accord et votre signature.";return}
  const pr=parseFloat($("kpr").value),has=!isNaN(pr)&&pr>=0;
  cupd(id,{kind:$("kt").value,title:t.slice(0,120),description:d.slice(0,4000),amount:has?pr:null,currency:has?$("kc").value:null,due_date:$("kdt").value||null,requester_signature:sg.slice(0,120),status:"envoye"})}}

/* ---------- Mon profil ---------- */
function renderP(v){v.innerHTML=profileForm(false)+`<div class="form" style="padding-top:0"><button class="btn o" id="lo">Se déconnecter</button><p style="margin:0;color:var(--mute);font-size:12px;text-align:center">${e(U.email||"")}</p></div>`;profileBind(false);
 $("lo").onclick=async()=>{await sb.auth.signOut();sb.removeAllChannels&&sb.removeAllChannels();U=null;ME=null;PR=new Map();MSG=[];CTR=[];ready=false;tab="c";authScreen("login")}}
/* ---------- Appels vidéo (WebRTC) ---------- */
// Pour les réseaux mobiles stricts, ajoutez ici un serveur TURN (identifiants fournis par votre service TURN).
const ICE=[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun.cloudflare.com:3478"}];
let CALL=null,RING=null;
function camErr(er){const n=er&&er.name;if(n==="NotAllowedError"||n==="PermissionDeniedError")return"Accès refusé. Autorisez la caméra et le micro (cadenas à côté de l’adresse du site), puis réessayez.";if(n==="NotFoundError"||n==="DevicesNotFoundError")return"Aucune caméra ou aucun micro détecté sur cet appareil.";if(n==="NotReadableError")return"La caméra est utilisée par une autre application.";return"Caméra indisponible ici. Ouvrez Mayschat dans Chrome ou Safari, à l’adresse https du site (pas dans un aperçu intégré)."}
const fmtDur=ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+":"+("0"+s%60).slice(-2)};
async function sendSig(to,kind,data){const r=await sb.rpc("send_signal",{target:to,kind:kind,data:data||{}});if(r.error)toast("Appel : "+e(r.error.message))}
function callUI(id){const d=document.createElement("div");d.id="call";d.style.cssText="position:fixed;inset:0;z-index:60;background:#0b141a;color:#fff;display:flex;flex-direction:column";
 const b=(i,t,bg)=>`<button id="${i}" title="${t}" style="width:58px;height:58px;border-radius:50%;border:0;background:${bg||"#ffffff26"};color:#fff;font-size:24px;cursor:pointer">${t.split(" ")[0]}</button>`;
 d.innerHTML=`<video id="rv" autoplay playsinline style="flex:1;width:100%;object-fit:cover;background:#111"></video><video id="lv" autoplay playsinline muted style="position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:96px;height:128px;object-fit:cover;border-radius:12px;border:2px solid #fff4;background:#222"></video><div style="position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;text-shadow:0 1px 4px #000"><b style="font-size:18px">${e(pname(id))}</b><div id="cs" style="font-size:14px;opacity:.9">Appel en cours…</div></div><div style="position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:14px;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(#0000,#000a)">${b("cm","🎤 Micro")}${b("cv","📷 Caméra")}${b("cf","🔄 Retourner")}${b("ce","📞 Raccrocher","#D32F2F")}</div>`;
 document.body.appendChild(d);$("lv").srcObject=CALL.local;
 $("cm").onclick=()=>{CALL.local.getAudioTracks().forEach(t=>t.enabled=!t.enabled);$("cm").style.opacity=CALL.local.getAudioTracks().some(t=>t.enabled)?1:.4};
 $("cv").onclick=()=>{CALL.local.getVideoTracks().forEach(t=>t.enabled=!t.enabled);$("cv").style.opacity=CALL.local.getVideoTracks().some(t=>t.enabled)?1:.4};
 $("cf").onclick=flipCam;$("ce").onclick=()=>endCall(true)}
function mkPC(){const pc=new RTCPeerConnection({iceServers:ICE});CALL.pc=pc;
 pc.onicecandidate=ev=>{if(ev.candidate&&CALL)sendSig(CALL.peer,"ice",ev.candidate.toJSON())};
 pc.ontrack=ev=>{$("rv").srcObject=ev.streams[0]};
 pc.onconnectionstatechange=()=>{if(!CALL)return;const s=pc.connectionState;if(s==="connected"){CALL.at=Date.now();clearTimeout(CALL.ring);$("cs").textContent="En ligne"}else if(s==="failed"){toast("Connexion impossible avec ce réseau. Réessayez, ou utilisez le Wi-Fi.");endCall(true)}};
 CALL.local.getTracks().forEach(t=>pc.addTrack(t,CALL.local))}
async function flipCam(){if(!CALL)return;const f=CALL.facing==="user"?"environment":"user";
 try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:f}}),nt=s.getVideoTracks()[0],snd=CALL.pc.getSenders().find(x=>x.track&&x.track.kind==="video");if(snd)await snd.replaceTrack(nt);CALL.local.getVideoTracks().forEach(t=>{t.stop();CALL.local.removeTrack(t)});CALL.local.addTrack(nt);$("lv").srcObject=CALL.local;CALL.facing=f}catch(er){toast(e(camErr(er)))}}
async function startCall(id){if(CALL||RING)return;let st;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:true})}catch(er){return toast(e(camErr(er)))}
 CALL={peer:id,local:st,isCaller:true,pend:[],facing:"user"};callUI(id);mkPC();
 const o=await CALL.pc.createOffer();await CALL.pc.setLocalDescription(o);sendSig(id,"offer",{sdp:o.sdp});
 CALL.ring=setTimeout(()=>{toast("Pas de réponse.");endCall(true)},45000)}
async function acceptCall(from,sdp,early){let st;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:true})}catch(er){sendSig(from,"decline");return toast(e(camErr(er)))}
 CALL={peer:from,local:st,isCaller:false,pend:[],facing:"user"};callUI(from);mkPC();$("cs").textContent="Connexion…";
 await CALL.pc.setRemoteDescription({type:"offer",sdp:sdp});for(const c of early)try{await CALL.pc.addIceCandidate(c)}catch(x){}
 const a=await CALL.pc.createAnswer();await CALL.pc.setLocalDescription(a);sendSig(from,"answer",{sdp:a.sdp})}
async function onSignal(p){if(!p||!p.from||p.from===U.id)return;const d=p.data||{};
 if(p.kind==="offer"){if(CALL||RING)return sendSig(p.from,"busy");
  const early=[];const el=ask(`<b>📹 ${e(pname(p.from))}</b> vous appelle en vidéo.`,()=>{clearTimeout(RING&&RING.t);RING=null;acceptCall(p.from,d.sdp,early)},"Répondre",false,()=>{clearTimeout(RING&&RING.t);RING=null;sendSig(p.from,"decline")});
  RING={from:p.from,el:el,early:early,t:setTimeout(()=>{if(RING){el.remove();RING=null}},45000)};return}
 if(p.kind==="ice"){if(CALL&&CALL.peer===p.from){if(CALL.pc.remoteDescription)try{await CALL.pc.addIceCandidate(d)}catch(x){}else CALL.pend.push(d)}else if(RING&&RING.from===p.from)RING.early.push(d);return}
 if(p.kind==="answer"&&CALL&&CALL.peer===p.from){await CALL.pc.setRemoteDescription({type:"answer",sdp:d.sdp});for(const c of CALL.pend)try{await CALL.pc.addIceCandidate(c)}catch(x){}CALL.pend=[];return}
 if((p.kind==="decline"||p.kind==="busy")&&CALL&&CALL.peer===p.from){toast(p.kind==="busy"?"Votre correspondant est déjà en appel.":"Appel refusé.");endCall(false);return}
 if(p.kind==="hangup"){if(RING&&RING.from===p.from){RING.el.remove();clearTimeout(RING.t);RING=null;toast(`Appel manqué de <b>${e(pname(p.from))}</b>.`)}else if(CALL&&CALL.peer===p.from){toast("Appel terminé.");endCall(false)}}}
function endCall(notify){if(!CALL)return;const c=CALL;CALL=null;clearTimeout(c.ring);if(notify)sendSig(c.peer,"hangup");try{c.pc&&c.pc.close()}catch(x){}c.local.getTracks().forEach(t=>t.stop());const el=$("call");if(el)el.remove();
 if(c.isCaller)sb.from("messages").insert({recipient:c.peer,body:c.at?"📹 Appel vidéo terminé ("+fmtDur(Date.now()-c.at)+")":"📹 Appel manqué"}).select().single().then(r=>{if(r.data&&!MSG.some(x=>x.id===r.data.id)){MSG.push(r.data);if(view==="chat"&&peer===c.peer)paintChat();else refresh()}})}
</script><script src="plus.js"></script><script>boot();
